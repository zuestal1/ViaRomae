# ============================================================================
# Nginx Reverse Proxy Configuration for JLW 2026
# ============================================================================
# Place this file in: /etc/nginx/sites-available/jlw2026
# Enable with: sudo ln -s /etc/nginx/sites-available/jlw2026 /etc/nginx/sites-enabled/
# ============================================================================

# ── Rate Limiting ───────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# ── Upstream Backends ───────────────────────────────────────────────────────
upstream backend_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream frontend_app {
    server 127.0.0.1:5173;
    keepalive 16;
}

upstream gm_dashboard {
    server 127.0.0.1:5174;
    keepalive 8;
}

# ── HTTP to HTTPS Redirect ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name jlw2026.example.com api.jlw2026.example.com gm.jlw2026.example.com;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================================
# 1. Frontend (Player App) - jlw2026.example.com
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jlw2026.example.com;

    # SSL Configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/jlw2026.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jlw2026.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client body size (for media uploads)
    client_max_body_size 50M;

    # Logging
    access_log /var/log/nginx/jlw2026_access.log;
    error_log /var/log/nginx/jlw2026_error.log warn;

    # Player WebSocket endpoint (must reach the API, not the Vite frontend)
    location = /api/v1/geo/ws {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Main frontend application
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ============================================================================
# 2. Backend API - api.jlw2026.example.com
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.jlw2026.example.com;

    # SSL Configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/api.jlw2026.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.jlw2026.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CORS (if needed - better to handle in backend)
    # add_header Access-Control-Allow-Origin "https://jlw2026.example.com" always;
    # add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    # add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

    # Client body size (for media uploads via API)
    client_max_body_size 50M;

    # Logging
    access_log /var/log/nginx/api_access.log;
    error_log /var/log/nginx/api_error.log warn;

    # Health check endpoint (no rate limiting)
    location /health {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Auth endpoints (strict rate limiting)
    location ~ ^/api/v1/(auth|register|login) {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket endpoint
    location = /api/v1/geo/ws {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeout
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # All other API endpoints (moderate rate limiting)
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for API
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ============================================================================
# 3. GM Dashboard - gm.jlw2026.example.com
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gm.jlw2026.example.com;

    # SSL Configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/gm.jlw2026.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gm.jlw2026.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers (stricter for GM dashboard)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.jlw2026.example.com wss://api.jlw2026.example.com;" always;

    # Logging
    access_log /var/log/nginx/gm_access.log;
    error_log /var/log/nginx/gm_error.log warn;

    # Basic Auth (zusätzliche Sicherheitsebene)
    # Erstellen mit: sudo htpasswd -c /etc/nginx/.htpasswd gmadmin
    auth_basic "GM Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # GM Dashboard
    location / {
        proxy_pass http://gm_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
