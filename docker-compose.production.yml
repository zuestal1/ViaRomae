services:
  # ── PostgreSQL + PostGIS ────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jugendleiter2026}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jlw_network

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      GM_FRONTEND_ORIGIN: ${GM_FRONTEND_ORIGIN:-}
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed-content:
        condition: service_completed_successfully
      roster-import:
        condition: service_completed_successfully
      release-preflight:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - jlw_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: "no"
    command: ["sh", "-c", "echo 'Migrations already applied, skipping.' && exit 0"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jlw_network

  seed-content:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: "no"
    command: ["pnpm", "run", "seed"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - jlw_network

  roster-import:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: "no"
    command: ["pnpm", "run", "roster:import"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ROSTER_FILE: /run/roster/roster.json
      ROSTER_SHA256: ${ROSTER_SHA256}
      EXPECTED_PLAYER_COUNT: ${EXPECTED_PLAYER_COUNT}
      EXPECTED_TEAM_COUNT: ${EXPECTED_TEAM_COUNT}
    volumes:
      - ${ROSTER_FILE}:/run/roster/roster.json:ro
    depends_on:
      seed-content:
        condition: service_completed_successfully
    networks:
      - jlw_network

  release-preflight:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: "no"
    command: ["pnpm", "run", "release:preflight"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EXPECTED_PLAYER_COUNT: ${EXPECTED_PLAYER_COUNT}
      EXPECTED_TEAM_COUNT: ${EXPECTED_TEAM_COUNT}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      GM_FRONTEND_ORIGIN: ${GM_FRONTEND_ORIGIN:-}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      roster-import:
        condition: service_completed_successfully
    networks:
      - jlw_network

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_MAPTILER_API_KEY: ${VITE_MAPTILER_API_KEY}
        VITE_GM_CLIENT_URL: ${VITE_GM_CLIENT_URL}
    restart: unless-stopped
    ports:
      - "0.0.0.0:5173:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - jlw_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── GM Client ───────────────────────────────────────────────────────────────
  gm-client:
    build:
      context: .
      dockerfile: docker/Dockerfile.gm-client
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "0.0.0.0:5174:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - jlw_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local

networks:
  jlw_network:
    driver: bridge
