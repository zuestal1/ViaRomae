# AWS S3 production stack. Deploy through: ./deploy.sh production
# Keep this file compatible with the Compose Specification used by Docker
# Compose v2. The obsolete top-level `version` key is intentionally omitted.

services:
  # ── PostgreSQL + PostGIS ────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-jugendleiter2026}
    ports:
      - "127.0.0.1:5432:5432"  # Nur localhost (sensible DB)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups  # Backup-Ordner mounten
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jlw_network

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # S3 Configuration
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    ports:
      - "127.0.0.1:3000:3000"  # Nur über den lokalen Reverse Proxy
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed-content:
        condition: service_completed_successfully
      roster-import:
        condition: service_completed_successfully
      release-preflight:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - jlw_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: "no"
    command: ["pnpm", "run", "db:migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jlw_network

  seed-content:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: "no"
    command: ["pnpm", "run", "seed"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - jlw_network

  # Kontrollierter One-shot: prüft die freigegebene Datei und importiert sie idempotent.
  roster-import:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: "no"
    command: ["pnpm", "run", "roster:import"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      ROSTER_FILE: /run/roster/roster.json
      ROSTER_SHA256: ${ROSTER_SHA256:?ROSTER_SHA256 is required}
      EXPECTED_PLAYER_COUNT: ${EXPECTED_PLAYER_COUNT:?EXPECTED_PLAYER_COUNT is required}
      EXPECTED_TEAM_COUNT: ${EXPECTED_TEAM_COUNT:?EXPECTED_TEAM_COUNT is required}
    volumes:
      - ${ROSTER_FILE:?ROSTER_FILE must point to an approved roster}:/run/roster/roster.json:ro
    depends_on:
      seed-content:
        condition: service_completed_successfully
    networks:
      - jlw_network

  release-preflight:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: "no"
    command: ["pnpm", "run", "release:preflight"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      EXPECTED_PLAYER_COUNT: ${EXPECTED_PLAYER_COUNT:?EXPECTED_PLAYER_COUNT is required}
      EXPECTED_TEAM_COUNT: ${EXPECTED_TEAM_COUNT:?EXPECTED_TEAM_COUNT is required}
    depends_on:
      roster-import:
        condition: service_completed_successfully
    networks:
      - jlw_network

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
        VITE_MAPTILER_API_KEY: ${VITE_MAPTILER_API_KEY:?VITE_MAPTILER_API_KEY is required}
        VITE_GM_CLIENT_URL: ${VITE_GM_CLIENT_URL:?VITE_GM_CLIENT_URL is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"  # Nur über den lokalen Reverse Proxy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - jlw_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── GM Client ───────────────────────────────────────────────────────────────
  gm-client:
    build:
      context: .
      dockerfile: docker/Dockerfile.gm-client
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5174:80"  # Nur über den lokalen Reverse Proxy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - jlw_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local

networks:
  jlw_network:
    driver: bridge
