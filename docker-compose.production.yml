# Load secrets with: docker compose -f docker-compose.production.yml --env-file .env.production up -d
version: "3.9"

services:
  # ── PostgreSQL + PostGIS ────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jugendleiter2026}
    ports:
      - "127.0.0.1:5432:5432"  # Nur localhost (sensible DB)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups  # Backup-Ordner mounten
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jlw_network

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # S3 Configuration
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "0.0.0.0:3000:3000"  # Von überall erreichbar
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed-content:
        condition: service_completed_successfully
      release-preflight:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - jlw_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: "no"
    command: ["pnpm", "run", "db:migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jlw_network

  seed-content:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: "no"
    command: ["pnpm", "run", "seed"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - jlw_network

  release-preflight:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: "no"
    command: ["pnpm", "run", "release:preflight"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      EXPECTED_PLAYER_COUNT: ${EXPECTED_PLAYER_COUNT:-13}
      EXPECTED_TEAM_COUNT: ${EXPECTED_TEAM_COUNT:-4}
    depends_on:
      seed-content:
        condition: service_completed_successfully
    networks:
      - jlw_network

  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_MAPTILER_API_KEY: ${VITE_MAPTILER_API_KEY}
        VITE_GM_CLIENT_URL: ${VITE_GM_CLIENT_URL}
    restart: unless-stopped
    ports:
      - "0.0.0.0:5173:80"  # Von überall erreichbar
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - jlw_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── GM Client ───────────────────────────────────────────────────────────────
  gm-client:
    build:
      context: .
      dockerfile: docker/Dockerfile.gm-client
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    ports:
      - "0.0.0.0:5174:80"  # Von überall erreichbar
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - jlw_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── MinIO (Self-Hosted S3-Alternative) ──────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "0.0.0.0:9000:9000"  # API - von überall erreichbar
      - "0.0.0.0:9001:9001"  # Console - von überall erreichbar
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - jlw_network

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-via-romae-media}
    networks:
      - jlw_network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  jlw_network:
    driver: bridge
